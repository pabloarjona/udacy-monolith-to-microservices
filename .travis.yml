language: node_js
node_js:
  - 22

services:
  - docker

install: 
  - echo "nothing needes to be installed"

before_script:
  - echo "No tests"

script:
  - docker build -t udagram-api-feed ./udagram-api-feed
  - docker tag udagram-api-feed 77159449420/udagram-api-feed:6
  - docker build -t udagram-api-user ./udagram-api-user
  - docker tag udagram-api-user 77159449420/udagram-api-user:6
  - docker build -t udagram-frontend ./udagram-frontend
  - docker tag udagram-frontend 77159449420/udagram-frontend:6
  - docker build -t reverseproxy ./udagram-reverseproxy
  - docker tag reverseproxy 77159449420/reverseproxy:6

after_success:
  - echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
  - docker push 77159449420/udagram-api-feed:6
  - docker push 77159449420/udagram-api-user:6
  - docker push 77159449420/udagram-frontend:6
  - docker push 77159449420/reverseproxy:6

