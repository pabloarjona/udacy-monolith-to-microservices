language: node_js
node_js:
  - 20

services:
  - docker

install:
  - echo "nothing needs to be installed"

before_script:
  - echo "no tests "

script: 
  - docker --version #print the version for logging
  - docker build -t udagram-api-feed .
  - docker tag udagram-api-feed 77159449420/udagram-api-feed:latest

after_success:
  - echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
  - docker push 77159449420/udagram-api-feed
